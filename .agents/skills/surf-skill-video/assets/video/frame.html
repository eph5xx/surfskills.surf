<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  surfskills.surf preview frame. video-build.mjs fills the __SLOTS__; never edit a built copy by hand.
  The frame owns beats 1, 2 and 4 (command, dock, end card). The author owns only #result, 3.0 -> 9.0 s.
  Rules: references/build-rules.md.
-->
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("assets/fonts/Bricolage-600.ttf") format("truetype");font-weight:600;}
@font-face{font-family:"Bricolage Grotesque";src:url("assets/fonts/Bricolage-700.ttf") format("truetype");font-weight:700;}
@font-face{font-family:"Onest";src:url("assets/fonts/Onest-500.ttf") format("truetype");font-weight:500;}
@font-face{font-family:"Onest";src:url("assets/fonts/Onest-600.ttf") format("truetype");font-weight:600;}
@font-face{font-family:"JetBrains Mono";src:url("assets/fonts/JetBrainsMono.ttf") format("truetype");font-weight:100 800;}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FCF9F5;}

/* Beat 3: the author's slot. Hidden outside 2.85 -> 9.35 s by the frame timeline. */
#result{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;opacity:0;}

/* Beats 1-2: the command, then its docked caption. */
#command{
  position:absolute;left:0;top:0;width:1920px;height:1080px;
  display:flex;align-items:center;justify-content:center;
}
#command-inner{
  max-width:1640px;text-align:center;
  font-family:"JetBrains Mono",monospace;font-size:__COMMAND_SIZE__px;font-weight:500;
  line-height:1.25;letter-spacing:-0.02em;color:#DD6B4D;
}
#caret{
  display:inline-block;width:0.09em;height:1em;margin-left:0.18em;
  vertical-align:-0.14em;border-radius:3px;background:#2A2C41;
}
#dock{
  position:absolute;left:0;bottom:34px;width:1920px;
  display:flex;justify-content:center;opacity:0;
}
#dock-caption{
  max-width:1760px;padding:6px 30px 10px;border-radius:999px;
  background:rgba(252,249,245,0.94);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:"JetBrains Mono",monospace;font-size:48px;font-weight:500;
  letter-spacing:-0.02em;color:#C4553A;
}

/* Beat 4: the end card. */
#endcard{
  position:absolute;left:0;top:0;width:1920px;height:1080px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:#FCF9F5;opacity:0;
}
#endcard-name{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:__NAME_SIZE__px;
  line-height:1;letter-spacing:-0.03em;color:#2A2C41;white-space:nowrap;
}
#endcard-name .dot{color:#DD6B4D;}
#endcard-by{
  font-family:"Onest",sans-serif;font-weight:500;font-size:60px;letter-spacing:-0.01em;
  color:#2A2C41;opacity:0.72;
}

/* ---- author css ---- */
__RESULT_CSS__
/* ---- end author css ---- */
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="11"
     style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#FCF9F5;">

  <div id="result">
<!-- ---- author markup ---- -->
__RESULT_MARKUP__
<!-- ---- end author markup ---- -->
  </div>

  <div id="command"><div id="command-inner">__COMMAND__<span id="caret"></span></div></div>
  <div id="dock"><div id="dock-caption">__COMMAND__</div></div>

  <div id="endcard">
    <div id="endcard-name">__SKILL_NAME__<span class="dot">.</span></div>
    <div id="endcard-by">__SKILL_BY__</div>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
  (function(){
    var tl = gsap.timeline({paused:true});
    tl.set("#result",{opacity:0},0);
    tl.set(["#dock","#endcard"],{opacity:0},0);

    // Beat 1 (0 -> 2.4): the command holds while the caret blinks.
    for (var i = 0; i < 5; i++) {
      tl.set("#caret",{opacity:0},0.45 + i*0.4);
      tl.set("#caret",{opacity:1},0.65 + i*0.4);
    }

    // Beat 2 (2.4 -> 3.0): the command docks to the bottom caption; the result slot opens.
    tl.set("#caret",{opacity:0},2.4);
    tl.to("#command",{scale:0.34,yPercent:44,opacity:0,duration:0.55,ease:"power2.inOut"},2.4);
    tl.fromTo("#dock",{opacity:0,y:14},{opacity:1,y:0,duration:0.4,ease:"power2.out",immediateRender:false},2.65);
    tl.to("#result",{opacity:1,duration:0.15,ease:"none"},2.85);

    // Beat 3 (3.0 -> 9.0): the result, written by the author. The checks audit exactly the tweens it adds.
    var frameTweens = tl.getChildren(true, true, true);
    (function(tl, R){
// ---- author timeline ----
__RESULT_TIMELINE__
// ---- end author timeline ----
    })(tl, {start:3.0, end:9.0});
    window.__authorTweens = tl.getChildren(true, true, true).filter(function(a){ return frameTweens.indexOf(a) < 0; });

    // Beat 4 (9.0 -> 11): the end card, then back to the command for a seamless loop.
    tl.to("#result",{opacity:0,duration:0.35,ease:"power2.in"},9.0);
    tl.to("#dock",{opacity:0,duration:0.3,ease:"power2.in"},9.0);
    tl.fromTo("#endcard",{opacity:0,y:30},{opacity:1,y:0,duration:0.45,ease:"power2.out",immediateRender:false},9.3);
    tl.to("#endcard",{opacity:0,duration:0.3,ease:"power2.in"},10.15);
    tl.set("#command",{scale:0.94,yPercent:0},10.2);
    tl.to("#command",{opacity:1,scale:1,duration:0.45,ease:"power2.out"},10.4);
    tl.set("#caret",{opacity:1},10.85);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  })();
  </script>
</div>
</body>
</html>
