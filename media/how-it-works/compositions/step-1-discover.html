<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("../fonts/bricolage-grotesque.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: "Onest";
        src: url("../fonts/onest.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; }
      body {
        font-family: "Onest", sans-serif;
        color: #2a2c41;
        background: #f4eae1;
      }
      .scene {
        position: relative;
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1000px;
        background: #fcf9f5;
        border: 1px solid #e7d9c8;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(42,44,65,.06), 0 10px 30px rgba(42,44,65,.07);
        padding: 44px;
      }
      .eyebrow {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #3d5a80;
        margin-bottom: 22px;
      }
      /* search */
      .search {
        position: relative;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 86px;
        padding: 0 28px;
        border: 1.5px solid #e7d9c8;
        border-radius: 12px;
        background: #fff;
      }
      #searchring {
        position: absolute;
        inset: -2px;
        border: 2.5px solid #f2b134;
        border-radius: 13px;
        opacity: 0;
        pointer-events: none;
      }
      .mag { width: 34px; height: 34px; flex: none; }
      .field { position: relative; flex: 1; height: 40px; }
      .field span {
        position: absolute;
        left: 0; top: 50%;
        transform: translateY(-50%);
        font-size: 34px;
        white-space: nowrap;
      }
      #placeholder { color: #2a2c41; opacity: .38; }
      #typed { color: #2a2c41; font-weight: 500; clip-path: inset(0 100% 0 0); }
      #caret {
        position: absolute;
        top: 50%; left: 0;
        width: 3px; height: 40px;
        background: #dd6b4d;
        opacity: 0;
      }
      /* results */
      .results { display: flex; flex-direction: column; gap: 18px; margin-top: 26px; }
      .skill {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 22px 26px;
        border: 1.5px solid #e7d9c8;
        border-radius: 14px;
        background: #fcf9f5;
      }
      .thumb {
        width: 76px; height: 76px; flex: none;
        border-radius: 12px;
        background: #f4eae1;
        border: 1px solid #e7d9c8;
        display: flex; align-items: center; justify-content: center;
      }
      .thumb .play {
        width: 0; height: 0;
        border-style: solid;
        border-width: 14px 0 14px 24px;
        border-color: transparent transparent transparent #dd6b4d;
        margin-left: 5px;
      }
      #match .thumb { background: #fdf3dc; border-color: #f2b134; }
      #match .thumb .play { border-left-color: #c98a1f; }
      .meta { flex: 1; min-width: 0; }
      .name { font-size: 30px; font-weight: 600; }
      .sub { font-size: 21px; color: #2a2c41; opacity: .55; margin-top: 4px; }
      .pill {
        flex: none;
        font-size: 21px;
        font-weight: 700;
        padding: 9px 20px;
        border-radius: 999px;
      }
      #pill { background: #f2b134; color: #2a2c41; opacity: 0; }
      .star { flex: none; font-size: 21px; font-weight: 600; color: #2a2c41; opacity: .4; }
      /* cursor */
      #cursor {
        position: absolute;
        left: 0; top: 0;
        width: 40px; height: 40px;
        filter: drop-shadow(0 2px 3px rgba(42,44,65,.25));
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="step1"
      data-start="0"
      data-duration="4.6"
      data-width="1280"
      data-height="800"
    >
      <div class="scene">
        <div class="card">
          <div class="eyebrow">Discover skills</div>
          <div class="search">
            <div id="searchring"></div>
            <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="#2a2c41" stroke-opacity=".5" stroke-width="2.4">
              <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
            <div class="field">
              <span id="placeholder">Search skills…</span>
              <span id="typed">validate idea</span>
              <span id="caret"></span>
            </div>
          </div>

          <div class="results">
            <div class="skill" id="match">
              <div class="thumb"><span class="play"></span></div>
              <div class="meta">
                <div class="name">validate-startup-idea</div>
                <div class="sub">Product strategy</div>
              </div>
              <div class="pill" id="pill">Match</div>
            </div>
            <div class="skill" id="other">
              <div class="thumb"><span class="play"></span></div>
              <div class="meta">
                <div class="name">map-any-codebase</div>
                <div class="sub">Engineering</div>
              </div>
              <div class="star">★ 1.2k</div>
            </div>
          </div>
        </div>

        <svg id="cursor" viewBox="0 0 24 24">
          <path d="M3 2 L3 21 L8.5 15.5 L12 22.5 L15 21 L11.5 14 L19 14 Z"
                fill="#2a2c41" stroke="#fcf9f5" stroke-width="1.2" />
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // initial states (kept off CSS to avoid transform/gsap conflicts)
      gsap.set("#cursor", { x: 700, y: 250 });
      gsap.set("#caret", { x: 0, opacity: 0 });
      gsap.set("#pill", { scale: 0.6 });
      gsap.set("#match", { boxShadow: "0px 14px 30px rgba(221,107,77,0)" });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // — cursor to search field, ring glows, caret on —
      tl.to("#cursor", { x: 360, y: 250, duration: 0.5, ease: "power2.inOut" }, 0.15);
      tl.to("#searchring", { opacity: 1, duration: 0.3 }, 0.45);
      tl.set("#caret", { opacity: 1 }, 0.5);
      // — type the query: placeholder out, reveal text L→R, caret follows —
      tl.to("#placeholder", { opacity: 0, duration: 0.2 }, 0.5);
      tl.to("#typed", { clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "steps(11)" }, 0.6);
      tl.to("#caret", { x: 250, duration: 0.85, ease: "steps(11)" }, 0.6);
      tl.to("#caret", { opacity: 0.12, duration: 0.4, repeat: 1, yoyo: true, ease: "steps(1)" }, 0.62);
      tl.set("#caret", { opacity: 0 }, 1.45);

      // — cursor drops to the match card; it lifts + turns gold; pill pops —
      tl.to("#cursor", { x: 300, y: 470, duration: 0.5, ease: "power2.inOut" }, 1.55);
      tl.to("#searchring", { opacity: 0, duration: 0.3 }, 1.55);
      tl.to("#match", {
        y: -6,
        borderColor: "#f2b134",
        boxShadow: "0px 14px 30px rgba(221,107,77,0.18)",
        duration: 0.45, ease: "power2.out",
      }, 1.75);
      tl.to("#other", { opacity: 0.5, duration: 0.4 }, 1.8);
      tl.to("#pill", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.95);

      // — hold the "found it" beat (≈2.4s → 3.75s) —

      // — reset to the empty resting frame for a seamless loop —
      tl.to("#pill", { opacity: 0, scale: 0.6, duration: 0.35, ease: "power2.in" }, 3.75);
      tl.to("#match", {
        y: 0, borderColor: "#e7d9c8",
        boxShadow: "0px 14px 30px rgba(221,107,77,0)", duration: 0.4,
      }, 3.8);
      tl.to("#other", { opacity: 1, duration: 0.4 }, 3.8);
      tl.to("#typed", { clipPath: "inset(0 100% 0 0)", duration: 0.4, ease: "power2.in" }, 3.85);
      tl.to("#placeholder", { opacity: 0.38, duration: 0.4 }, 4.1);
      tl.to("#cursor", { x: 700, y: 250, duration: 0.6, ease: "power2.inOut" }, 3.95);
      tl.set("#caret", { x: 0 }, 4.35);

      window.__timelines["step1"] = tl;
    </script>
  </body>
</html>
