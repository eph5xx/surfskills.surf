<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("../fonts/bricolage-grotesque.woff2") format("woff2");
        font-weight: 400 700; font-display: block;
      }
      @font-face {
        font-family: "Onest";
        src: url("../fonts/onest.woff2") format("woff2");
        font-weight: 400 700; font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; }
      body { font-family: "Onest", sans-serif; color: #2a2c41; background: #f4eae1; }
      .scene {
        position: relative; width: 1280px; height: 800px;
        display: flex; align-items: center; justify-content: center;
      }
      .stack { width: 1040px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .panel {
        width: 100%;
        background: #fcf9f5;
        border: 1px solid #e7d9c8;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(42,44,65,.06), 0 10px 30px rgba(42,44,65,.07);
        padding: 34px 38px;
      }
      .eyebrow {
        font-size: 21px; font-weight: 600; letter-spacing: .14em;
        text-transform: uppercase; color: #3d5a80; margin-bottom: 18px;
      }
      .cmdrow { display: flex; align-items: stretch; gap: 18px; }
      .cmdbox {
        flex: 1; display: flex; align-items: center; gap: 16px;
        background: #2a2c41; border-radius: 12px; padding: 0 26px; height: 84px;
      }
      .cmdbox .prompt { color: #f2b134; font-size: 27px; font-weight: 700; font-family: ui-monospace, "SF Mono", monospace; }
      .cmdbox .cmd { color: #fcf9f5; font-size: 25px; font-family: ui-monospace, "SF Mono", monospace; opacity: .92; white-space: nowrap; }
      .btn {
        position: relative; flex: none; width: 338px; height: 84px;
        border-radius: 12px; background: #f2b134;
        display: flex; align-items: center; justify-content: center;
      }
      .btn .lbl {
        position: absolute; display: flex; align-items: center; gap: 12px;
        font-size: 25px; font-weight: 700; color: #2a2c41; white-space: nowrap;
      }
      #lblCopied { opacity: 0; }
      .btn .check { width: 30px; height: 30px; }
      .btn .check path { stroke: #2a2c41; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      /* arrow */
      #arrow { width: 46px; height: 46px; opacity: .35; }
      #arrow path { stroke: #dd6b4d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      /* agent panel */
      .titlebar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .dots { display: flex; gap: 9px; }
      .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
      .agent-name { font-size: 23px; font-weight: 600; }
      .tools { margin-left: auto; font-size: 20px; color: #2a2c41; opacity: .5; }
      .promptrow { display: flex; align-items: center; gap: 18px; }
      .prompt-input {
        position: relative; flex: 1; height: 84px;
        border: 1.5px solid #e7d9c8; border-radius: 12px; background: #fff;
        display: flex; align-items: center; padding: 0 26px; overflow: hidden;
      }
      .prompt-input span { position: absolute; left: 26px; font-size: 29px; white-space: nowrap; }
      #agentPlaceholder { color: #2a2c41; opacity: .38; }
      #agentCmd { color: #2a2c41; font-weight: 500; font-family: ui-monospace, "SF Mono", monospace; clip-path: inset(0 100% 0 0); }
      #agentCaret { left: 26px; width: 3px; height: 38px; background: #dd6b4d; opacity: 0; position: absolute; }
      .send {
        flex: none; width: 84px; height: 84px; border-radius: 12px;
        background: #e7d9c8; display: flex; align-items: center; justify-content: center;
      }
      .send svg { width: 34px; height: 34px; }
      .send path { stroke: #fcf9f5; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #cursor {
        position: absolute; left: 0; top: 0; width: 40px; height: 40px;
        filter: drop-shadow(0 2px 3px rgba(42,44,65,.25)); z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step2" data-start="0" data-duration="4.6" data-width="1280" data-height="800">
      <div class="scene">
        <div class="stack">
          <!-- skill-page install row -->
          <div class="panel">
            <div class="eyebrow">Install command</div>
            <div class="cmdrow">
              <div class="cmdbox">
                <span class="prompt">▸</span>
                <span class="cmd">install validate-startup-idea</span>
              </div>
              <div class="btn" id="btn">
                <span class="lbl" id="lblPaste">Paste into your agent</span>
                <span class="lbl" id="lblCopied">
                  <svg class="check" viewBox="0 0 24 24"><path id="checkPath" d="M5 13 l4 4 l10 -11" /></svg>
                  Copied
                </span>
              </div>
            </div>
          </div>

          <svg id="arrow" viewBox="0 0 24 24"><path d="M12 4 V19 M6 13 l6 6 l6 -6" /></svg>

          <!-- the agent you already use -->
          <div class="panel">
            <div class="titlebar">
              <span class="dots"><i style="background:#dd6b4d"></i><i style="background:#f2b134"></i><i style="background:#6f8f4f"></i></span>
              <span class="agent-name">Your agent</span>
              <span class="tools">Claude · Cursor · ChatGPT</span>
            </div>
            <div class="promptrow">
              <div class="prompt-input">
                <span id="agentPlaceholder">Message your agent…</span>
                <span id="agentCmd">install validate-startup-idea</span>
                <span id="agentCaret"></span>
              </div>
              <div class="send" id="send">
                <svg viewBox="0 0 24 24"><path d="M12 20 V5 M6 11 l6 -6 l6 6" /></svg>
              </div>
            </div>
          </div>
        </div>

        <svg id="cursor" viewBox="0 0 24 24">
          <path d="M3 2 L3 21 L8.5 15.5 L12 22.5 L15 21 L11.5 14 L19 14 Z"
                fill="#2a2c41" stroke="#fcf9f5" stroke-width="1.2" />
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      gsap.set("#cursor", { x: 760, y: 250 });
      gsap.set("#lblCopied", { scale: 0.9 });
      gsap.set("#agentCaret", { x: 0, opacity: 0 });
      gsap.set("#send", { scale: 1 });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // — cursor to the Paste button, press —
      tl.to("#cursor", { x: 905, y: 250, duration: 0.55, ease: "power2.inOut" }, 0.15);
      tl.to("#btn", { scale: 0.96, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, 0.72);
      // — button flips to Copied ✓ —
      tl.to("#lblPaste", { opacity: 0, duration: 0.18 }, 0.8);
      tl.to("#lblCopied", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.86);

      // — arrow pulses down —
      tl.to("#arrow", { opacity: 1, y: 6, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.0);

      // — command lands in the agent prompt —
      tl.set("#agentCaret", { opacity: 1 }, 1.2);
      tl.to("#agentPlaceholder", { opacity: 0, duration: 0.2 }, 1.2);
      tl.to("#agentCmd", { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "steps(12)" }, 1.3);
      tl.to("#agentCaret", { x: 430, duration: 0.8, ease: "steps(12)" }, 1.3);
      tl.to("#agentCaret", { opacity: 0.12, duration: 0.4, repeat: 1, yoyo: true, ease: "steps(1)" }, 1.32);
      tl.set("#agentCaret", { opacity: 0 }, 2.15);
      // — send button activates —
      tl.to("#send", { backgroundColor: "#f2b134", scale: 1.06, duration: 0.3, ease: "back.out(2)" }, 2.15);
      tl.to("#send", { scale: 1, duration: 0.25 }, 2.45);

      // — hold (≈2.7s → 3.7s) —

      // — reset for a seamless loop —
      tl.to("#send", { backgroundColor: "#e7d9c8", duration: 0.35 }, 3.7);
      tl.to("#agentCmd", { clipPath: "inset(0 100% 0 0)", duration: 0.4, ease: "power2.in" }, 3.75);
      tl.to("#agentPlaceholder", { opacity: 0.38, duration: 0.4 }, 4.0);
      tl.to("#lblCopied", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 3.8);
      tl.to("#lblPaste", { opacity: 1, duration: 0.3 }, 4.05);
      tl.to("#cursor", { x: 760, y: 250, duration: 0.6, ease: "power2.inOut" }, 3.85);
      tl.set("#agentCaret", { x: 0 }, 4.3);

      window.__timelines["step2"] = tl;
    </script>
  </body>
</html>
