<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("../fonts/bricolage-grotesque.woff2") format("woff2");
        font-weight: 400 700; font-display: block;
      }
      @font-face {
        font-family: "Onest";
        src: url("../fonts/onest.woff2") format("woff2");
        font-weight: 400 700; font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; }
      body { font-family: "Onest", sans-serif; color: #2a2c41; background: #f4eae1; }
      .scene { position: relative; width: 1280px; height: 800px; display: flex; align-items: center; justify-content: center; }
      .card {
        width: 1040px; background: #fcf9f5; border: 1px solid #e7d9c8; border-radius: 16px;
        box-shadow: 0 1px 2px rgba(42,44,65,.06), 0 10px 30px rgba(42,44,65,.07);
        padding: 38px 40px;
      }
      .eyebrow { font-size: 21px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #3d5a80; margin-bottom: 22px; }
      .io { display: flex; align-items: stretch; gap: 24px; }
      .col { display: flex; flex-direction: column; }
      .col-head { font-size: 18px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #2a2c41; opacity: .45; margin-bottom: 12px; }
      .input { width: 340px; flex: none; }
      .idea {
        flex: 1; background: #f4eae1; border: 1px solid #e7d9c8; border-radius: 12px;
        padding: 22px; font-size: 26px; line-height: 1.35; color: #2a2c41;
      }
      .arrow-col { display: flex; align-items: center; }
      #ioarrow { width: 42px; height: 42px; opacity: .4; }
      #ioarrow path { stroke: #dd6b4d; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .result { flex: 1; position: relative; min-height: 240px; }
      /* processing */
      #proc { position: absolute; inset: 30px 0 0 0; display: flex; align-items: center; gap: 16px; }
      #proc .dots { display: flex; gap: 10px; }
      #proc .dots i { width: 16px; height: 16px; border-radius: 50%; background: #dd6b4d; display: block; }
      #proc .ptext { font-size: 24px; color: #2a2c41; opacity: .6; }
      /* chips */
      #chips { display: flex; flex-direction: column; gap: 14px; }
      .chip {
        display: flex; align-items: center; gap: 16px;
        background: #fff; border: 1.5px solid #e7d9c8; border-radius: 12px; padding: 16px 22px;
      }
      .chip .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
      .chip .clabel { font-size: 25px; font-weight: 600; flex: 1; }
      .chip .cmark { font-size: 24px; font-weight: 700; color: #6f8f4f; }
      /* verdict */
      .verdict { display: flex; align-items: center; gap: 18px; margin-top: 30px; padding-top: 26px; border-top: 1.5px solid #e7d9c8; }
      .vlabel { font-size: 24px; font-weight: 700; }
      .vspacer { flex: 1; }
      .vpill {
        font-size: 26px; font-weight: 800; padding: 12px 30px; border-radius: 999px;
        background: #f4eae1; color: #2a2c41; opacity: .4; letter-spacing: .03em;
      }
      #vGo { color: #fcf9f5; }
      #cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; filter: drop-shadow(0 2px 3px rgba(42,44,65,.25)); z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="step3" data-start="0" data-duration="4.8" data-width="1280" data-height="800">
      <div class="scene">
        <div class="card">
          <div class="eyebrow">Validation report</div>
          <div class="io">
            <div class="col input">
              <div class="col-head">Your idea</div>
              <div class="idea">A B2C app for personalized fitness coaching</div>
            </div>
            <div class="arrow-col">
              <svg id="ioarrow" viewBox="0 0 24 24"><path d="M4 12 H19 M13 6 l6 6 l-6 6" /></svg>
            </div>
            <div class="col result">
              <div class="col-head">What you get</div>
              <div id="proc">
                <span class="dots"><i></i><i></i><i></i></span>
                <span class="ptext">Running 14 evaluators…</span>
              </div>
              <div id="chips">
                <div class="chip" id="chip1"><span class="dot" style="background:#dd6b4d"></span><span class="clabel">Risks &amp; Assumptions</span><span class="cmark">✓</span></div>
                <div class="chip" id="chip2"><span class="dot" style="background:#3d5a80"></span><span class="clabel">Dimensions research</span><span class="cmark">✓</span></div>
                <div class="chip" id="chip3"><span class="dot" style="background:#f2b134"></span><span class="clabel">Next steps</span><span class="cmark">✓</span></div>
              </div>
            </div>
          </div>

          <div class="verdict">
            <span class="vlabel">Verdict</span>
            <span class="vspacer"></span>
            <span class="vpill" id="vGo">GO</span>
            <span class="vpill" id="vPivot">PIVOT</span>
            <span class="vpill" id="vStop">STOP</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      gsap.set("#proc", { opacity: 0 });
      gsap.set(["#chip1", "#chip2", "#chip3"], { opacity: 0, y: 16 });
      gsap.set("#vGo", { backgroundColor: "#f4eae1", color: "#2a2c41", opacity: 0.4 });
      gsap.set("#ioarrow", { opacity: 0.4 });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // — input feeds in: arrow pulses —
      tl.to("#ioarrow", { opacity: 1, x: 5, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.2);
      // — processing: dots pulse —
      tl.to("#proc", { opacity: 1, duration: 0.3 }, 0.45);
      tl.to("#proc .dots i", { y: -10, duration: 0.32, stagger: 0.12, repeat: 3, yoyo: true, ease: "sine.inOut" }, 0.5);

      // — results stagger in, processing fades —
      tl.to("#proc", { opacity: 0, duration: 0.3 }, 1.55);
      tl.to("#chip1", { opacity: 1, y: 0, duration: 0.45 }, 1.65);
      tl.to("#chip2", { opacity: 1, y: 0, duration: 0.45 }, 1.82);
      tl.to("#chip3", { opacity: 1, y: 0, duration: 0.45 }, 1.99);

      // — verdict stamps GO (color fill + a quick pop) —
      tl.to("#vGo", { backgroundColor: "#6f8f4f", color: "#fcf9f5", opacity: 1, duration: 0.4 }, 2.35);
      tl.to("#vGo", { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 2.35);

      // — hold (≈2.9s → 3.9s) —

      // — reset for a seamless loop —
      tl.to("#vGo", { backgroundColor: "#f4eae1", color: "#2a2c41", opacity: 0.4, duration: 0.4, ease: "power2.in" }, 3.95);
      tl.to(["#chip3", "#chip2", "#chip1"], { opacity: 0, y: 16, duration: 0.4, stagger: 0.08, ease: "power2.in" }, 4.0);

      window.__timelines["step3"] = tl;
    </script>
  </body>
</html>
